syntax = "proto3";

package dcn;

message Transformation {
    string name = 1;
    string sol_src = 2; // execution input; kept in local storage or a verified artifact, never in the registry response
    uint32 args_count = 3; // chain-derivable (emitted by TransformationAdded / contract getArgsCount())
}

// Internal full record (used in storage, indexing, etc.)
message TransformationRecord 
{
  Transformation transformation = 1;
  string owner = 2;
}
