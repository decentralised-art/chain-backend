name: Build (windows-x64 Release)

on:
  workflow_run:
    workflows: ["Test (Windows Debug)"]
    types: [completed]
    branches: [ main ]

jobs:
  build-windows-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up compiler cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        variant: sccache
        key: ${{ github.job }}
        max-size: 2G

    - name: Configure and build (RelWithDebInfo)
      run: |
        cmake -S . -B build-windows-release -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_INSTALL_PREFIX=install -DCMAKE_BUILD_TYPE=RelWithDebInfo
        cmake --build build-windows-release --config RelWithDebInfo --target install -j 4

    - name: Pack install directory into tarball
      run: |
        tar -czf chain-backend-windows-x64.tar.gz -C install .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: chain-backend-windows-x64
        path: chain-backend-windows-x64.tar.gz
