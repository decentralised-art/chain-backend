name: Test (macOS Debug)

on:
  push:

jobs:
  test-macos-debug:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: brew install npm

    - name: Set up compiler cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        variant: sccache
        key: ${{ github.job }}
        max-size: 2G

    - name: Configure and build tests (Debug)
      run: |
        cmake -S . -B build-macos-debug -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DDECENTRALISED_ART_BUILD_TESTS=ON -DDECENTRALISED_ART_USE_SUBMODULE_PT=ON -DCMAKE_INSTALL_PREFIX=install-macos-debug -DCMAKE_BUILD_TYPE=Debug
        cmake --build build-macos-debug --config Debug --target DecentralisedArtServerTests -j 4

    - name: Build executable (Debug)
      run: cmake --build build-macos-debug --config Debug --target DecentralisedArtServer -j 4

    - name: Run tests
      run: ctest --test-dir build-macos-debug -C Debug -j 4 --output-on-failure
