name: Build (macos-arm64 Release)

on:
  workflow_run:
    workflows: ["Test (macOS Debug)"]
    types: [completed]
    branches: [ main ]

jobs:
  build-macos-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: brew install npm

    - name: Set up compiler cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        variant: sccache
        key: ${{ github.job }}
        max-size: 2G

    - name: Configure and build (RelWithDebInfo)
      run: |
        cmake -S . -B build-macos-release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_INSTALL_PREFIX=install -DCMAKE_BUILD_TYPE=RelWithDebInfo
        cmake --build build-macos-release --config RelWithDebInfo --target install -j 4

    - name: Pack install directory into tarball
      run: |
        tar -czf chain-backend-macos-arm64.tar.gz -C install .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: chain-backend-macos-arm64
        path: chain-backend-macos-arm64.tar.gz
