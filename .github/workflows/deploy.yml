name: Deploy to Server

on:
  workflow_run:
    workflows: ["Build (linux-x64 Release)"]
    types: [completed]
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# The repository's default token permissions are read-only for contents and
# packages, so the artifact list and download need actions: read.
permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_INSTALL_DIR: ${{ vars.DEPLOY_INSTALL_DIR }}
      DEPLOY_SERVICE_NAME: ${{ vars.DEPLOY_SERVICE_NAME }}
    
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Check deployment variables
      run: |
        for name in DEPLOY_HOST DEPLOY_USER DEPLOY_INSTALL_DIR DEPLOY_SERVICE_NAME; do
          if [[ -z "${!name}" ]]; then
            echo "::error::Required repository variable $name is not set"
            exit 1
          fi
        done

    - name: Install tools
      run: sudo apt update && sudo apt install -y sshpass rsync

    - name: Download and extract artifacts
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.event.workflow_run.id }}
        ARTIFACT_NAME: chain-backend-linux-x64
      run: |
        mkdir -p artifact
        echo "Getting artifact list..."
        curl -f -s -H "Authorization: token $GITHUB_TOKEN" \
             "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts" \
          > artifacts.json

        ARTIFACT_ID=$(jq -r --arg NAME "$ARTIFACT_NAME" '.artifacts[] | select(.name == $NAME) | .id' artifacts.json)

        if [ -z "$ARTIFACT_ID" ]; then
          echo "❌ Artifact '$ARTIFACT_NAME' not found"
          exit 1
        fi

        echo "✅ Found artifact ID: $ARTIFACT_ID"
        echo "Downloading artifact..."
        curl -f -L -H "Authorization: token $GITHUB_TOKEN" \
          -o artifact.zip \
          "https://api.github.com/repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip"

        unzip artifact.zip -d artifact
        mkdir install
        tar -xzf artifact/${ARTIFACT_NAME}.tar.gz -C install
    
    - name: Stop server service
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.DEPLOY_HOST }}
        username: ${{ env.DEPLOY_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        envs: DEPLOY_SERVICE_NAME
        script: |
          sudo systemctl stop "$DEPLOY_SERVICE_NAME"
          echo "Service stopped"
    
    - name: Clear remote install directory
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.DEPLOY_HOST }}
        username: ${{ env.DEPLOY_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        envs: DEPLOY_INSTALL_DIR
        script: |
          echo "Clearing $DEPLOY_INSTALL_DIR..."
          mkdir -p /tmp/empty-dir
          rsync -a --delete --exclude 'storage' /tmp/empty-dir/ "$DEPLOY_INSTALL_DIR/"

    - name: Upload to server
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        # Create temp key file and restrict permissions
        KEY_FILE=$(mktemp)
        echo "$SSH_PRIVATE_KEY" > "$KEY_FILE"
        chmod 600 "$KEY_FILE"

        # Use rsync to copy contents (not the 'install/' dir itself)
        rsync -az --delete --exclude 'storage' -e "ssh -i $KEY_FILE -o StrictHostKeyChecking=no" \
          install/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_INSTALL_DIR/"

        # Clean up key file
        rm -f "$KEY_FILE"
      shell: bash

    - name: Restart server service
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.DEPLOY_HOST }}
        username: ${{ env.DEPLOY_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        envs: DEPLOY_SERVICE_NAME
        script: |
          sudo systemctl restart "$DEPLOY_SERVICE_NAME"
          sudo systemctl status "$DEPLOY_SERVICE_NAME" --no-pager
          echo "Service restarted"
